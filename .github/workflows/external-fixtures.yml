name: External fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run generate
      - run: git diff --exit-code
      - run: npm run check:external
